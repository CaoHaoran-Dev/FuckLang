name: FuckLang CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Run Go Tests
        run: go test -v ./...

  build:
    name: Cross-compile Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Cross-compile Binaries
        run: |
          mkdir -p build
          
          # Linux
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64   go build -ldflags="-s -w" -o build/fucklang-linux-amd64        ./cmd/fucklang
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64   go build -ldflags="-s -w" -o build/fucklang-linux-arm64        ./cmd/fucklang
          CGO_ENABLED=0 GOOS=linux   GOARCH=riscv64 go build -ldflags="-s -w" -o build/fucklang-linux-riscv64      ./cmd/fucklang
          CGO_ENABLED=0 GOOS=linux   GOARCH=loong64 go build -ldflags="-s -w" -o build/fucklang-linux-loong64      ./cmd/fucklang
          
          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64   go build -ldflags="-s -w" -o build/fucklang-windows-amd64.exe  ./cmd/fucklang
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64   go build -ldflags="-s -w" -o build/fucklang-windows-arm64.exe  ./cmd/fucklang
          
          # macOS
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64   go build -ldflags="-s -w" -o build/fucklang-darwin-amd64       ./cmd/fucklang
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64   go build -ldflags="-s -w" -o build/fucklang-darwin-arm64       ./cmd/fucklang

      - name: Package Source Code
        run: |
          tar -czvf build/fucklang-source.tar.gz --exclude='.git' --exclude='build' .
          zip -r build/fucklang-source.zip . -x ".git/*" "build/*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FuckLang-Builds
          path: build/
          retention-days: 7
          if-no-files-found: error