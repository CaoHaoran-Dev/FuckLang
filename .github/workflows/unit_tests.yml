name: FuckLang CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod tidy

      - name: Run Go Tests
        run: go test -v ./...

  build:
    name: Cross-compile Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod tidy

      - name: Cross-compile Binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o build/fucklang-linux-amd64        ./cmd/fucklang
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/fucklang-windows-amd64.exe  ./cmd/fucklang
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o build/fucklang-darwin-arm64       ./cmd/fucklang
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o build/fucklang-darwin-amd64       ./cmd/fucklang

      - name: Package Source Code
        run: |
          tar -czvf build/fucklang-source.tar.gz --exclude='.git' --exclude='build' .
          zip -r build/fucklang-source.zip . -x ".git/*" "build/*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FuckLang-Builds
          path: build/
          retention-days: 7
          if-no-files-found: error